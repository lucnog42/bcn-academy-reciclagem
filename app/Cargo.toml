[package]
name = "ng3-painel"
version = "0.1.0"
edition = "2024"
publish = false
description = "Video Automation NG3 — painel nativo (Rune): acervo de qualquer marca, grade, preview, marcações, geração e plugins Luau."

[[bin]]
name = "ng3-painel"
path = "src/main.rs"

[dependencies]
# Rune é pré-lançamento: fica preso a uma rev do branch dev (que nunca é reescrito).
rune = { git = "https://github.com/anomalyco/rune", rev = "d91315e4c89837bec7fadfaf14f26d02534c444f" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "d91315e4c89837bec7fadfaf14f26d02534c444f" }
rune-luau = { git = "https://github.com/anomalyco/rune", rev = "d91315e4c89837bec7fadfaf14f26d02534c444f", features = ["serde", "watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# o Rune usa winit e wgpu-hal com remendos próprios (vendor/ do repositório dele)
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "d91315e4c89837bec7fadfaf14f26d02534c444f" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "d91315e4c89837bec7fadfaf14f26d02534c444f" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 16
incremental = true
