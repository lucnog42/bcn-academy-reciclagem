# Tags da marca: vocabulário controlado para o import, os cortes e a busca.
# Tags livres podem ser criadas no painel; as que se repetem podem ser promovidas para cá.
# Cada categoria: nome, se aceita várias tags por mídia, e a lista (slug = "Nome visível").

[categorias.pessoa]
nome = "Pessoa"
multipla = true
tags = {}                      # ex.: { "fulano" = "Fulano da Silva" }

[categorias.lugar]
nome = "Lugar"
multipla = true
tags = {}

[categorias.momento]
nome = "Momento"
multipla = true
tags = { "chegada" = "Chegada", "treino" = "Treino", "jogo" = "Jogo", "bastidor" = "Bastidor", "depoimento" = "Depoimento" }

[categorias.plano]
nome = "Plano"
multipla = false
tags = { "aberto" = "Aberto", "medio" = "Médio", "fechado" = "Fechado", "detalhe" = "Detalhe", "drone" = "Drone" }

[categorias.qualidade]
nome = "Qualidade"
multipla = false
tags = { "otima" = "Ótima", "usavel" = "Usável", "ruim" = "Ruim" }
