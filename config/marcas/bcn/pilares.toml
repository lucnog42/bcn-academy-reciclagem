# Pilares (temas) da marca e as palavras que os revelam na legenda e na fala.
# peso: 3 = específico do tema, 2 = contextual, 1 = fraco. Ver acervo/colecao.py.

[pilares]
ordem = ["DEPOIMENTO", "MIC", "INTERCAMBIO", "ATLETA", "JOGO", "AVALIACAO", "BASTIDOR", "DIVULGACAO"]
# rótulo quando nada decide (o produto também usa SEM_LEGENDA para "sem texto")
fallback = "OUTROS"
evidencia_minima = 2.5

[pilares.angulo]   # como reaproveitar cada pilar (plano de reciclagem)
"DEPOIMENTO" = "prova social — quem já foi conta"
"AVALIACAO" = "chamada para a próxima avaliação (CTA direto)"
"MIC" = "arquivo do torneio — nostalgia + 'vem jogar em 2027'"
"SEM_LEGENDA" = "material sem texto — escrever legenda do zero pelo visual"
"INTERCAMBIO" = "antes/depois do intercâmbio (rotina, escola, clube)"
"ATLETA" = "trajetória do atleta — daqui até o profissional"
"JOGO" = "lance/gol como prova de nível técnico"
"BASTIDOR" = "bastidor humano — treino, viagem, chegada"
"DIVULGACAO" = "oferta reaproveitada com nova oferta/data"
"OUTROS" = "material de arquivo para completar o feed"

[termos]
